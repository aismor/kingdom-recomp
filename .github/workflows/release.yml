name: Release

# A tag v<VERSION> (v0.2.3-aismor) builds both setups, which carry a toolchain and no game data
# (tools/make_release.py, tools/make_release_linux.py), and publishes them as the tag's GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  MNG_URL: https://github.com/ly05010419/MacNativeGames.git
  MNG_COMMIT: b75be8cfa704df3701e86130c8ced268e79d6b11   # tools/make_release.py MNG_COMMIT

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: python3 tools/check_content.py

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: MSYS2 gcc and make (hactool)
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -S --needed --noconfirm mingw-w64-ucrt-x86_64-gcc make"
      - name: MacNativeGames with history (shader list)
        shell: bash
        run: |
          git clone --filter=blob:none "$MNG_URL" refs/MacNativeGames
          git -C refs/MacNativeGames checkout -q "$MNG_COMMIT"
      - run: python tools/build_hactool.py
      - run: python tools/build_xlate.py
      - run: >
          python tools/make_release.py --out build/release/Kingdom-Setup
          --zip build/release/Kingdom-Setup-${{ needs.version.outputs.version }}-windows.zip --no-gpu
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/release/Kingdom-Setup-*-windows.zip

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: python -m pip install pillow
      - run: sudo apt-get update && sudo apt-get install -y xvfb   # the window's --selftest needs a display
      - name: MacNativeGames with history (shader list)
        run: |
          git clone --filter=blob:none "$MNG_URL" refs/MacNativeGames
          git -C refs/MacNativeGames checkout -q "$MNG_COMMIT"
      - run: >
          xvfb-run -a python tools/make_release_linux.py --out build/release/Kingdom-Setup-linux
          --appimage build/release/Kingdom-Setup-${{ needs.version.outputs.version }}-x86_64.AppImage --no-gpu
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/release/Kingdom-Setup-*-x86_64.AppImage

  publish:
    needs: [version, windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Kingdom Recomp ${{ needs.version.outputs.version }}
          body_path: docs/releases/v${{ needs.version.outputs.version }}.md
          prerelease: false
          files: dist/*
